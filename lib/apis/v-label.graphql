# import "./fragments.graphql"

query GetVLabel($locale: I18NLocaleCode) {
  vLabel(locale: $locale) {
    data {
      attributes {
        contentTitle1
        contentImage1 {
          ...PhotoUrl
        }
        titlePage
        descriptionPage
        content
        txtButton
        hyperlink
        titleListLogos
        listLogos {
          ...LogoDetail
        }
        thumbnail {
          ...PhotoUrl
        }
        seo {
          ...Seo
        }
      }
    }
  }
}
